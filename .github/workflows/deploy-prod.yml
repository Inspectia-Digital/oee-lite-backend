name: Deploy Backend PROD

on:
  push:
    branches:
      - prod
  workflow_dispatch: {}
    # Permite disparar el workflow a mano desde la pestaña Actions de GitHub.

env:
  PROJECT_ID: oee-control
  REGION: us-central1
  SERVICE_NAME: api-oeelite-prod
  DB_INSTANCE: oee-control:us-central1:oeelite-db-prod
  CLOUD_SQL_PROXY_VERSION: 2.14.0

jobs:
  # Mismo gate que dev (Fase K): nada se despliega a producción sin que
  # pase el suite de tests completo contra un Postgres real.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: oeelite_user
          POSTGRES_PASSWORD: oeelite_password
          POSTGRES_DB: oeelite_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oeelite_user -d oeelite_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Auditoría de dependencias (informativa, no bloqueante)
        run: |
          python -m pip install pip-audit
          python -m pip-audit -r requirements.txt --desc || true

      - name: Run migrations against test DB
        env:
          DATABASE_URL: postgresql://oeelite_user:oeelite_password@localhost:5432/oeelite_db
        run: python -m alembic upgrade head

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+psycopg2://oeelite_user:oeelite_password@localhost:5432/oeelite_db
          ENVIRONMENT: development
        run: python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Declara un GitHub Environment "production": permite configurar en
    # Settings > Environments > production un paso de aprobación manual
    # (required reviewers) sin tocar este archivo. No viene activado por
    # default -- lo configurás vos si lo querés.
    environment:
      name: production
    permissions:
      contents: 'read'
      id-token: 'write' # Requerido para Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validar secretos de producción requeridos
        env:
          RAW_DB_URL: ${{ secrets.PROD_DATABASE_URL_TCP }}
          CORS_ORIGINS: ${{ secrets.PROD_CORS_ORIGINS }}
          AUTH0_DOMAIN: ${{ secrets.PROD_AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.PROD_AUTH0_AUDIENCE }}
        run: |
          faltantes=""
          [ -z "$RAW_DB_URL" ] && faltantes="$faltantes PROD_DATABASE_URL_TCP"
          [ -z "$CORS_ORIGINS" ] && faltantes="$faltantes PROD_CORS_ORIGINS"
          [ "$CORS_ORIGINS" = "*" ] && faltantes="$faltantes PROD_CORS_ORIGINS(no_puede_ser_*)"
          [ -z "$AUTH0_DOMAIN" ] && faltantes="$faltantes PROD_AUTH0_DOMAIN"
          [ -z "$AUTH0_AUDIENCE" ] && faltantes="$faltantes PROD_AUTH0_AUDIENCE"
          if [ -n "$faltantes" ]; then
            echo "ERROR: faltan (o son inválidos) estos secrets de GitHub para producción:$faltantes"
            echo "Configurarlos en Settings > Secrets and variables > Actions antes de desplegar a prod."
            exit 1
          fi

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2.1.2
        with:
          workload_identity_provider: 'projects/15861740515/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-deploy-sa@oee-control.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Mismo enfoque que deploy-dev.yml: el proxy se arranca, se espera y
      # se usa todo en el mismo step (ver esa nota ahí para el porqué).
      - name: Set up Cloud SQL Auth Proxy and run migration
        env:
          RAW_DB_URL: ${{ secrets.PROD_DATABASE_URL_TCP }}
          ENVIRONMENT: production
          CORS_ORIGINS: ${{ secrets.PROD_CORS_ORIGINS }}
          AUTH0_DOMAIN: ${{ secrets.PROD_AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.PROD_AUTH0_AUDIENCE }}
        run: |
          curl -sSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy

          ./cloud-sql-proxy "$DB_INSTANCE" --port 5432 > cloud-sql-proxy.log 2>&1 &
          PROXY_PID=$!
          disown

          echo "Esperando a que el proxy levante (PID $PROXY_PID)..."
          LISTO=""
          for i in $(seq 1 15); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Proxy escuchando en 127.0.0.1:5432."
              LISTO="si"
              break
            fi
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              echo "ERROR: el proceso del proxy murió antes de levantar. Log:"
              cat cloud-sql-proxy.log
              exit 1
            fi
            sleep 2
          done
          if [ -z "$LISTO" ]; then
            echo "ERROR: timeout esperando al proxy. Log:"
            cat cloud-sql-proxy.log
            exit 1
          fi

          export DATABASE_URL="$RAW_DB_URL"
          python -m alembic current
          python -m alembic upgrade head

          kill "$PROXY_PID" 2>/dev/null || true

      - name: Authorize Docker push
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Container
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/$PROJECT_ID/oeelite-backend/$SERVICE_NAME:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Deploy to Cloud Run
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/$PROJECT_ID/oeelite-backend/$SERVICE_NAME:${{ github.sha }}"
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_TAG \
            --region $REGION \
            --project $PROJECT_ID \
            --add-cloudsql-instances $DB_INSTANCE \
            --set-secrets="DATABASE_URL=PROD_DATABASE_URL:latest" \
            --set-env-vars="ENVIRONMENT=production,AUTH0_DOMAIN=${{ secrets.PROD_AUTH0_DOMAIN }},AUTH0_AUDIENCE=${{ secrets.PROD_AUTH0_AUDIENCE }},CORS_ORIGINS=${{ secrets.PROD_CORS_ORIGINS }}" \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --cpu 1 \
            --memory 512Mi \
            --port 8080
      # NOTA: --allow-unauthenticated es correcto acá (igual que en dev):
      # es el gate de IAM de Cloud Run, que exige un token de identidad de
      # Google -- no tiene nada que ver con la autenticación real de la
      # app (JWT de Auth0 para humanos, X-Device-Key para M2M). El front
      # nunca manda un token de identidad de Google, así que
      # --no-allow-unauthenticated rompería el acceso público real. La
      # seguridad la sigue dando la app, no Cloud Run.
