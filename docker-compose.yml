version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: oeelite_postgres
    restart: always
    environment:
      POSTGRES_USER: oeelite_user
      POSTGRES_PASSWORD: oeelite_password
      POSTGRES_DB: oeelite_db
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oeelite_user -d oeelite_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: